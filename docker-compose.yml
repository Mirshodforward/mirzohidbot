services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mirzohid_db}
      POSTGRES_USER: ${POSTGRES_USER:-miniuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da majburiy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miniuser} -d ${POSTGRES_DB:-mirzohid_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port tashqariga chiqarilmagan — bazaga faqat ichki tarmoqdan kiriladi.

  # Migratsiyalar alohida bir martalik konteynerda: api ko'tarilganda sxema
  # allaqachon tayyor bo'ladi va bir nechta nusxa bir vaqtda migratsiya
  # qilishga urinmaydi.
  migrate:
    build:
      context: ./apps/api
    restart: "no"
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miniuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mirzohid_db}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miniuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mirzohid_db}
      USE_WEBHOOK: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      # Next server-side rewrite shu manzilga uzatadi (ichki tarmoq nomi).
      API_ORIGIN: http://api:8000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env da majburiy, masalan: mirzohid.uz}
    depends_on:
      - web
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
