# Mirzohid — nginx vhost (mavjud nginx/1.18 ga qo'shiladi).
#
# NEGA CADDY EMAS: bu serverda nginx allaqachon 80/443 ni egallagan va
# api.axisstars.uz kabi ishlab turgan saytlarga xizmat qilmoqda. Caddy
# konteynerini ko'tarish o'sha saytlarni buzadi.
#
# O'rnatish:
#   sudo cp deploy/nginx-mirzohid.conf /etc/nginx/sites-available/mirzohid
#   sudo ln -s /etc/nginx/sites-available/mirzohid /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d SUBDOMAIN.DOMEN.uz
#
# certbot 443 blokini va sertifikat yo'llarini o'zi qo'shadi.

server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMAIN.DOMEN.uz;   # <-- almashtiring

    # Fayl yuklash (Excel hisobotlar) uchun zaxira
    client_max_body_size 20m;

    access_log /var/log/nginx/mirzohid.access.log;
    error_log  /var/log/nginx/mirzohid.error.log;

    # --- Telegram webhook: to'g'ridan-to'g'ri API ga ---
    location /telegram/ {
        proxy_pass http://127.0.0.1:8801;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Telegram javobni 60 s kutadi
        proxy_read_timeout 65s;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8801;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Next.js: sayt + Mini App ---
    location / {
        proxy_pass http://127.0.0.1:3801;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # DIQQAT: X-Frame-Options QO'YMANG — Telegram Mini App sahifani iframe
    # ichida ochadi, u bilan oq ekran chiqadi.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
